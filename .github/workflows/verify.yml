name: Verify source and evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify packaged source, weights and evidence
        run: |
          python scripts/check_repository.py
          python scripts/verify_benchmarks.py
          python -B -m unittest discover -s benchmarks/tests -v
          python native/verify_source.py
      - name: Test the pinned native workspace
        working-directory: native
        run: cargo test --locked --workspace
      - name: Build and exercise the CPU lifecycle
        working-directory: native
        run: |
          cargo build --locked --release --bin weight_evolution
          python smoke.py
      - name: Test the scoped Claude Code plugin against the new binary
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exercise the scoped Claude Code plugin against the new binary
        run: |
          bash plugins/ruflo-neural-evolution/scripts/smoke.sh
          python - <<'PY'
          import hashlib, os, pathlib, subprocess
          binary = pathlib.Path('native/target/release/weight_evolution').resolve()
          env = dict(os.environ, RUFLO_NEURAL_TEST_BINARY=str(binary),
                     RUFLO_NEURAL_TEST_BINARY_SHA256=hashlib.sha256(binary.read_bytes()).hexdigest())
          subprocess.run(['node', '--test', 'plugins/ruflo-neural-evolution/test/native-wire.test.mjs'], env=env, check=True)
          PY

  python-and-sandbox:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install gateway and test dependencies
        run: python -m pip install -e '.[gateway,test]' huggingface_hub==1.33.0
      - name: Test gateway, policy and operating system sandbox
        run: python -m pytest tests/test_core.py tests/test_budget.py tests/test_integration.py tests/test_gateway.py tests/test_cloud_identity.py tests/test_cloud_publication.py
