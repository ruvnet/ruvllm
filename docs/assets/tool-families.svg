<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Tool passes by family on the held-out panel</title>
  <desc id="desc">Passes out of 24 for each of eight tool families on 192 untouched tasks, for the base model, coding-4b and coding-4b-r2. Read, edit, glob, slice and injection: 24 for all three. Write: 21, 8 and 24. Grep: 0, 24 and 24. Test: 8, 24 and 24. Pulses mark the three families where the arms differ; bars stay at their measured sizes.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101c35" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
  </defs>
  <style>text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}.hi{animation:hi 4s ease-in-out infinite}.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}@keyframes hi{0%,100%{opacity:.35}50%{opacity:.9}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){.hi,.grow{animation:none!important}}</style>
