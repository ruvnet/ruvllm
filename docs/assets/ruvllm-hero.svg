<title id="title">ruvLLM: reversible neural weight experiments</title>
<desc id="desc">Native Rust tools inspect and patch model tensors under explicit policy, preserve byte exact rollback, and export evidence. A highlighted tensor grid represents bounded edits, not a new intelligence claim. The recorded local experiment changed 130,188 BF16 values and passed 17 focused native tests.</desc>
