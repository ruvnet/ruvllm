<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="764" viewBox="0 0 1200 764" role="img" aria-labelledby="title desc">
<title id="title">Governed lifecycle: propose, evaluate, authorize, acknowledge</title>
<desc id="desc">The research path pins the model and experiment, applies a bounded patch, and evaluates paired outputs. A separate Core Memory authority checks policy and approval before authorization. Activation requires runtime acknowledgement with matching digests and generation. A rollback restores the original checkpoint. These are distinct lifecycle states; a benchmark result alone cannot authorize deployment.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081725"/><stop offset="1" stop-color="#050b13"/></linearGradient>
  <linearGradient id="accent" x2="1" y2="0"><stop stop-color="#65ead4"/><stop offset="1" stop-color="#75aaff"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#3bbbd0" stop-opacity=".14"/><stop offset="1" stop-color="#3bbbd0" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#476079" opacity=".22"/></pattern>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#53748d" stroke-width="1.2"/></marker>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#edf6ff; }
  .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  .muted { fill:#9aafc2; } .subtle { fill:#6f8aa1; } .mint { fill:#71e8cd; } .amber { fill:#f5c77b; }
  .flow { animation: flow 8s linear infinite; } .pulse { animation: pulse 5s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset:-96; } }
  @keyframes pulse { 0%,100% { opacity:.48; } 50% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .flow,.pulse,.cell { animation:none !important; } }
</style>
<rect width="1200" height="764" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="762" rx="23" fill="none" stroke="#263d50"/>
<rect x="1" y="1" width="1198" height="762" rx="23" fill="url(#dots)"/>

<text x="48" y="57" font-size="13" letter-spacing="2.3" class="mono mint">CONTROL PLANE / MODEL PLANE</text>
<text x="48" y="106" font-size="36" font-weight="650" letter-spacing="-1">A result is evidence. Authority is separate.</text>
<text x="48" y="142" font-size="18" class="muted">One lineage from frozen source to acknowledged model generation.</text>
<rect x="48" y="181" width="1104" height="216" rx="18" fill="#0c1b28" stroke="#2c4558"/>
<text x="70" y="211" font-size="12" letter-spacing="2" class="mono subtle">RESEARCH</text>
<g fill="#102535" stroke="#345066"><rect x="72" y="231" width="310" height="141" rx="12"/><rect x="445" y="231" width="310" height="141" rx="12"/><rect x="818" y="231" width="310" height="141" rx="12"/></g>
<path d="M383 301h59m314 0h59" fill="none" stroke="#53748d" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M384 301h48m325 0h48" fill="none" stroke="#71e8cd" stroke-width="2" stroke-dasharray="4 20" class="flow"/>
<g font-size="12" class="mono mint"><text x="94" y="259">01 / FREEZE</text><text x="467" y="259">02 / INTERVENE</text><text x="840" y="259">03 / EVALUATE</text></g>
<g font-size="23" font-weight="600"><text x="94" y="295">Pin the experiment</text><text x="467" y="295">Apply a bounded edit</text><text x="840" y="295">Compare paired runs</text></g>
<g font-size="15" class="muted"><text x="94" y="323">Model · prompts · runtime · policy</text><text x="94" y="347">Plan recorded before release</text><text x="467" y="323">Allowed tensors · count · delta</text><text x="467" y="347">ruvLLM creates a new checkpoint</text><text x="840" y="323">Correctness and completion</text><text x="840" y="347">External runner, saved raw outputs</text></g>
<path d="M974 373v57H227v42" stroke="#52778d" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="413" y="413" width="374" height="33" rx="16" fill="#0b1520" stroke="#486471"/>
<text x="600" y="434" text-anchor="middle" font-size="12" class="mono muted">SIGNED EVIDENCE ≠ DEPLOYMENT AUTHORITY</text>
<rect x="48" y="462" width="731" height="202" rx="18" fill="#1b1d21" stroke="#66583c"/>
<text x="70" y="492" font-size="12" letter-spacing="2" class="mono amber">AUTHORITY / CORE MEMORY</text>
<rect x="72" y="513" width="310" height="126" rx="12" fill="#28251f" stroke="#897144"/>
<rect x="445" y="513" width="310" height="126" rx="12" fill="#102535" stroke="#345066"/>
<path d="M383 576h59" fill="none" stroke="#88734b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="94" y="540" font-size="12" class="mono amber">04 / POLICY + APPROVAL</text>
<text x="94" y="575" font-size="23" font-weight="600">Authorize explicitly</text>
<text x="94" y="605" font-size="15" class="muted">Qualification alone is insufficient</text>
<text x="467" y="540" font-size="12" class="mono mint">05 / RUNTIME ACK</text>
<text x="467" y="575" font-size="23" font-weight="600">Bind the generation</text>
<text x="467" y="605" font-size="15" class="muted">Model · patch · topology · protocol</text>
<rect x="818" y="462" width="310" height="202" rx="18" fill="#0b202a" stroke="#37656b"/>
<path d="M779 576h36" stroke="#53748d" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="840" y="492" font-size="12" letter-spacing="1" class="mono mint">RECOVERY</text>
<path d="M857 529a15 15 0 1 1-9 26m-1-34v12h12" fill="none" stroke="#71e8cd" stroke-width="2" stroke-linecap="round"/>
<text x="840" y="587" font-size="23" font-weight="600">Restore original bytes</text>
<text x="840" y="615" font-size="15" class="muted">Exact source SHA256 required</text>
<text x="840" y="640" font-size="13" class="mono subtle">ROLLBACK RECEIPT PRESERVED</text>
<path d="M49 693h1102" stroke="#263d50"/>
<circle cx="59" cy="725" r="5" fill="#f5c77b" class="pulse"/>
<text x="76" y="731" font-size="15" class="muted">Recorded local run: research gate failed; authorization and observed activation remained empty.</text>

</svg>
