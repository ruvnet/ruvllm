<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">How RuVLLM runs a reversible weight experiment</title>
  <desc id="desc">Four steps: freeze the model, tasks and limits; edit a new copy; compare answers on the same tasks; verify exact byte restoration. Results do not automatically deploy a model.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101c35" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blue">
      <stop stop-color="#60a5fa" />
      <stop offset="1" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="mint">
      <stop stop-color="#5eead4" />
      <stop offset="1" stop-color="#a7f3d0" />
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" stroke="#6682a7" fill="none" stroke-width="1.5" />
    </marker>
  </defs>
  <style>text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}.flow{animation:flow 6s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.cell{animation:cell 5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes cell{0%,100%{fill:#174a50;stroke:#5eead4}50%{fill:#5eead4;stroke:#a7f3d0}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.cell{animation:none!important}}</style>
  <rect width="960" height="540" rx="24" fill="url(#bg)" />
  <rect x="1" y="1" width="958" height="538" rx="23" stroke="#304361" fill="none" />
  <text x="40" y="55" font-size="34" fill="#f8fafc" font-weight="700">One experiment. A clear way back.</text>
  <text x="40" y="90" font-size="22" fill="#bacce4" font-weight="400">Keep the original safe while you test a candidate.</text>
  <rect x="40" y="128" width="400" height="124" rx="16" fill="#15253e" stroke="#3a5275" />
  <text x="62" y="161" font-size="18" fill="#5eead4" font-weight="700">01</text>
  <text x="62" y="198" font-size="27" fill="#f1f5f9" font-weight="650">Freeze the setup</text>
  <text x="62" y="230" font-size="21" fill="#bacce4" font-weight="400">Fix the model, tasks and limits.</text>
  <rect x="520" y="128" width="400" height="124" rx="16" fill="#15253e" stroke="#3a5275" />
  <text x="542" y="161" font-size="18" fill="#5eead4" font-weight="700">02</text>
  <text x="542" y="198" font-size="27" fill="#f1f5f9" font-weight="650">Edit a copy</text>
  <text x="542" y="230" font-size="21" fill="#bacce4" font-weight="400">Change only approved values.</text>
  <rect x="520" y="304" width="400" height="124" rx="16" fill="#15253e" stroke="#3a5275" />
  <text x="542" y="337" font-size="18" fill="#5eead4" font-weight="700">03</text>
  <text x="542" y="374" font-size="27" fill="#f1f5f9" font-weight="650">Compare answers</text>
  <text x="542" y="406" font-size="21" fill="#bacce4" font-weight="400">Same tasks. Same settings.</text>
  <rect x="40" y="304" width="400" height="124" rx="16" fill="#15253e" stroke="#3a5275" />
  <text x="62" y="337" font-size="18" fill="#5eead4" font-weight="700">04</text>
  <text x="62" y="374" font-size="27" fill="#f1f5f9" font-weight="650">Verify restoration</text>
  <text x="62" y="406" font-size="21" fill="#bacce4" font-weight="400">Recover every original byte.</text>
  <path d="M444 190h70" fill="none" stroke="#6682a7" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M720 256v42" fill="none" stroke="#6682a7" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M516 366h-70" fill="none" stroke="#6682a7" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M444 190h66M720 256v38M516 366h-66" fill="none" stroke="#5eead4" stroke-width="3" stroke-dasharray="5 12" class="flow" />
  <rect x="40" y="462" width="880" height="50" rx="12" fill="#153a3d" stroke="#396d6b" />
  <text x="480" y="494" font-size="22" fill="#b9f3e7" font-weight="500" text-anchor="middle">A result is evidence. Deployment needs separate approval.</text>
</svg>
