<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">Recorded 4B adapter results: small gains, inconclusive evidence</title>
  <desc id="desc">In the historical A100 BF16 run, tool passes rose from 24 of 27 to 27 of 27. Code passes rose from 133 of 164 to 135 of 164. These gains are statistically inconclusive. Pulses highlight recorded values; bars remain at their measured sizes.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101c35" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blue">
      <stop stop-color="#60a5fa" />
      <stop offset="1" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="mint">
      <stop stop-color="#5eead4" />
      <stop offset="1" stop-color="#a7f3d0" />
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" stroke="#6682a7" fill="none" stroke-width="1.5" />
    </marker>
  </defs>
  <style>text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}.flow{animation:flow 6s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.cell{animation:cell 5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes cell{0%,100%{fill:#174a50;stroke:#5eead4}50%{fill:#5eead4;stroke:#a7f3d0}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.cell{animation:none!important}}</style>
  <rect width="960" height="450" rx="24" fill="url(#bg)" />
  <rect x="1" y="1" width="958" height="448" rx="23" stroke="#304361" fill="none" />
  <text x="40" y="54" font-size="34" fill="#f8fafc" font-weight="700">Does the change help?</text>
  <text x="40" y="90" font-size="21" fill="#bacce4" font-weight="400">Recorded A100 GPU run · Qwen3.5 4B · BF16</text>
  <rect x="40" y="122" width="400" height="238" rx="16" fill="#15253e" stroke="#3a5275" />
  <text x="62" y="160" font-size="27" fill="#f1f5f9" font-weight="650">Tool tasks</text>
  <text x="62" y="196" font-size="21" fill="#bacce4" font-weight="400">Base</text>
  <text x="418" y="196" font-size="21" fill="#60a5fa" font-weight="600" text-anchor="end">24 / 27</text>
  <rect x="62" y="209" width="356" height="15" rx="7" fill="#283950" />
  <rect x="62" y="209" width="316.44" height="15" rx="7" fill="#60a5fa" />
  <text x="62" y="265" font-size="21" fill="#bacce4" font-weight="400">With adapter</text>
  <text x="418" y="265" font-size="21" fill="#5eead4" font-weight="600" text-anchor="end">27 / 27</text>
  <rect x="62" y="278" width="356" height="15" rx="7" fill="#283950" />
  <rect x="62" y="278" width="356.00" height="15" rx="7" fill="#5eead4" />
  <circle cx="411.00" cy="285.5" r="4" fill="#e3fff6" class="pulse" />
  <text x="62" y="337" font-size="22" fill="#a7f3d0" font-weight="600">3 additional passes</text>
  <rect x="520" y="122" width="400" height="238" rx="16" fill="#15253e" stroke="#3a5275" />
  <text x="542" y="160" font-size="27" fill="#f1f5f9" font-weight="650">Code tasks</text>
  <text x="542" y="196" font-size="21" fill="#bacce4" font-weight="400">Base</text>
  <text x="898" y="196" font-size="21" fill="#60a5fa" font-weight="600" text-anchor="end">133 / 164</text>
  <rect x="542" y="209" width="356" height="15" rx="7" fill="#283950" />
  <rect x="542" y="209" width="288.71" height="15" rx="7" fill="#60a5fa" />
  <text x="542" y="265" font-size="21" fill="#bacce4" font-weight="400">With adapter</text>
  <text x="898" y="265" font-size="21" fill="#5eead4" font-weight="600" text-anchor="end">135 / 164</text>
  <rect x="542" y="278" width="356" height="15" rx="7" fill="#283950" />
  <rect x="542" y="278" width="293.05" height="15" rx="7" fill="#5eead4" />
  <circle cx="828.05" cy="285.5" r="4" fill="#e3fff6" class="pulse" />
  <text x="542" y="337" font-size="22" fill="#a7f3d0" font-weight="600">2 additional passes</text>
  <text x="40" y="413" font-size="23" fill="#fcd596" font-weight="550">Small gains. Statistical evidence is still inconclusive.</text>
</svg>
